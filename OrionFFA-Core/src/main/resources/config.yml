split:
  max-arenas-default: 10
  kits: [nethpot, diapot, axe, maceht, macelt, spearmace, smpkit, uhc, crystalffa, opduel, cart, elymace]
  arenas: {}

arena-reset:
  enabled: true
  # Timed reset scheduler. The scheduler only considers arena entries with
  # BOTH enabled: true AND scheduled: true. This lets you choose exactly
  # which arenas participate in automatic resets.
  schedule:
    enabled: true
    interval-seconds: 300
    run-on-startup: false
  defaults:
    # New arenas created with /ffa arena save <id> inherit this value.
    scheduled: true
  provider: fawe
  async: true
  reset-on-kit-death: false
  reset-on-split-end: true
  schematic-folder: schematics
  operations:
    ignore-air: false
    copy-entities: false
    paste-entities: false
    paste-biomes: true
  # Arena entries can be created automatically with:
  #   1. Use FAWE/WorldEdit //wand, //pos1 and //pos2 to select the arena.
  #   2. Run /ffa arena save <arena-id>.
  # The selection is saved as <arena-id>.schem and the target is the
  # selection's minimum point. You can then edit scheduled: true/false
  # here to decide whether that arena is reset on the global timer.
  arenas: {}

safezone:
  enabled: true
  pos1: null
  pos2: null
  push-distance: 1.0

clearlag:
  enabled: true
  interval-seconds: 10
  warning-seconds: 3
