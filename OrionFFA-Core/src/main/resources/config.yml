# =============================================================
# OrionFFACore 2.3.0 - EVERYTHING IMPORTANT IS CONFIGURABLE
# Paper 26.2 / Java 25 runtime recommended by Paper 26.2
# =============================================================
server:
  ffa-world: ffa
  require-immediate-respawn: true
  prevent-leaving-with-kit: true
  admin-permission: ffa.admin
  player-permission: ffa.use

inventory:
  mode: multiverse-inventories # multiverse-inventories | native | none
  multiverse-inventories:
    enabled: true
    # OrionFFACore never copies a player's main-world inventory when this is true.
    # Multiverse-Inventories remains authoritative when changing worlds.
    respect-world-groups: true
  restore-xp-on-back: true
  restore-level-on-back: true

placeholders:
  enabled: true
  identifier: orionffa
  # %orionffa_kills% etc. always use the player current world.
  # Explicit world forms are also supported when the world name is a valid suffix:
  # %orionffa_kills_ffa%, %orionffa_deaths_ffa%, %orionffa_kd_ffa%

statistics:
  enabled: true
  # YAML stores stats locally when storage.mode is yaml. MySQL stores them in its own table when enabled.
  count-only-ffa-deaths: true
  best-kd-minimum-kills: 1

storage:
  # yaml = local custom-kits.yml | mysql = async MySQL-backed custom kits
  mode: yaml
  mysql:
    host: 127.0.0.1
    port: 3306
    database: minecraft
    username: root
    password: "CHANGE_ME"
    use-ssl: false
    worker-threads: 2
    selection-retry-ticks: 4
    fallback-to-yaml: true
    table-prefix: orionffa_

locations:
  lobby:
    # Run /ffa setlobby once to populate this location.
    world: null
    x: 0.0
    y: 0.0
    z: 0.0
    yaw: 0.0
    pitch: 0.0
  edit-kit:
    # Run /ffa seteditkit once to populate this location.
    world: null
    x: 0.0
    y: 0.0
    z: 0.0
    yaw: 0.0
    pitch: 0.0

settings:
  clear-interval-seconds: 10
  clear-warning-seconds: 3
  combat-tag-seconds: 10
  killer-credit-seconds: 15
  crystal-credit-seconds: 5
  party-max-members: 10
  split-min-members: 2
  split-end-delay-seconds: 5
  safezone-check-ticks: 2
  selector-slot-count: 9

recovery:
  enabled: true
  use-post-respawn-event: true
  pose: STANDING
  fixed-pose: true
  zero-velocity: true
  clear-active-item: true
  leave-vehicle: true
  reset-sneaking: true
  reset-sprinting: true
  reset-gliding: true
  reset-riptiding: true
  reset-flying: true
  resend-entity-data: true
  recovery-ticks: [1, 2, 4, 8, 12]
  teleport-to-lobby-after-respawn: true
  final-gamemode: SURVIVAL
  never-use-kill: true

messages:
  # Every message below is passed through the small-caps formatter when enabled.
  use-prefix: true
  prefix: '&8[&6✦ &eᴏʀɪᴏɴ &8• &6ꜰꜰᴀ&8] &r'
  small-caps:
    enabled: true
    skip-commands: true
  join: '&aᴡᴇʟᴄᴏᴍᴇ ᴛᴏ ᴛʜᴇ ꜰꜰᴀ ʟᴏʙʙʏ! &7ᴜsᴇ &e/ffa menu &7ᴏʀ ʏᴏᴜʀ ʜᴏᴛʙᴀʀ.'
  kit-selected: '&aᴋɪᴛ sᴇʟᴇᴄᴛᴇᴅ: &f{kit} &8• &7ɢᴏᴏᴅ ʟᴜᴄᴋ!'
  back: '&aʏᴏᴜ ʜᴀᴠᴇ ʟᴇꜰᴛ ꜰꜰᴀ. &7ʏᴏᴜʀ ɪɴᴠᴇɴᴛᴏʀʏ ʜᴀs ʙᴇᴇɴ ʀᴇsᴛᴏʀᴇᴅ.'
  no-lobby: '&cᴛʜᴇ ꜰꜰᴀ ʟᴏʙʙʏ ɪs ɴᴏᴛ ᴄᴏɴꜰɪɢᴜʀᴇᴅ.'
  must-join: '&cʏᴏᴜ ᴍᴜsᴛ ᴊᴏɪɴ ꜰꜰᴀ ꜰɪʀsᴛ: &e/ffa join&c.'
  must-world: '&cʏᴏᴜ ᴍᴜsᴛ ʙᴇ ɪɴ ᴛʜᴇ ꜰꜰᴀ ᴡᴏʀʟᴅ.'
  no-permission: '&cʏᴏᴜ ᴅᴏ ɴᴏᴛ ʜᴀᴠᴇ ᴘᴇʀᴍɪssɪᴏɴ.'
  combat-safezone: '&c⛔ ʏᴏᴜ ᴄᴀɴɴᴏᴛ ᴇɴᴛᴇʀ ᴛʜᴇ sᴀꜰᴇᴢᴏɴᴇ ᴡʜɪʟᴇ ɪɴ ᴄᴏᴍʙᴀᴛ!'
  party-no-party: '&cʏᴏᴜ ᴀʀᴇ ɴᴏᴛ ɪɴ ᴀ ᴘᴀʀᴛʏ.'
  party-chat-on: '&aᴘᴀʀᴛʏ ᴄʜᴀᴛ &8• &fᴏɴ'
  party-chat-off: '&cᴘᴀʀᴛʏ ᴄʜᴀᴛ &8• &fᴏꜰꜰ'
  storage-migrate-done: '&aᴍɪɢʀᴀᴛɪᴏɴ ᴄᴏᴍᴘʟᴇᴛᴇ: &f{count} &7ᴄᴜsᴛᴏᴍ ᴋɪᴛs ᴡᴇʀᴇ ᴜᴘsᴇʀᴛᴇᴅ ɪɴᴛᴏ ᴍʏsǫʟ.'
  storage-loading: '&eʟᴏᴀᴅɪɴɢ ʏᴏᴜʀ ᴄᴜsᴛᴏᴍ ᴋɪᴛs... &7ᴘʟᴇᴀsᴇ ᴡᴀɪᴛ ᴀ ᴍᴏᴍᴇɴᴛ.'
  split-start: '&d✦ &f sᴘʟɪᴛ ᴍᴀᴛᴄʜ &8• &eᴀʀᴇɴᴀ #{arena} &8• &fᴛᴇᴀᴍ {team}'
  clear-warning: '&6⚠ &eᴅʀᴏᴘᴘᴇᴅ ɪᴛᴇᴍs ᴡɪʟʟ ʙᴇ ᴄʟᴇᴀʀᴇᴅ sᴏᴏɴ.'

selector:
  normal:
    - {slot: 0, material: NETHERITE_SWORD, name: '&6FFA Menu &7(Right Click)', lore: []}
    - {slot: 1, material: BOOK, name: '&eEdit Kits &7(Right Click)', lore: []}
    - {slot: 3, material: ENDER_EYE, name: '&bSpectate &7(Right Click)', lore: []}
    - {slot: 4, material: FIREWORK_ROCKET, name: '&dParty &7(Right Click)', lore: []}
    - {slot: 5, material: DIAMOND_SWORD, name: '&b&lSword Arena &7(Right Click)', lore: ['&7Instant teleport + Sword Kit']}
  party:
    - {slot: 0, material: NETHERITE_SWORD, name: '&6Party Info &7(Right Click)', lore: ['&7Click to view party info']}
    - {slot: 4, material: PAPER, name: '&eParty Chat Toggle &7(Right Click)', lore: ['&7Click to toggle party chat mode']}
    - {slot: 8, material: REDSTONE, name: '&cDisband / Leave Party &7(Right Click)', lore: ['&7Click to disband or leave your party']}

gui:
  kit-title: '&8FFA Kits'
  party-info-title: '&8Party Info Menu'
  party-fights-title: '&8Party Fights'
  split-title: '&8Split - Select Kit'
  spectate-title: '&8Spectate Players'
  edit-title: '&8Edit Kits Menu'
  close-slot: 31
  kit-slots: [10, 11, 12, 13, 14, 15, 16, 20, 21, 22, 23, 24]

