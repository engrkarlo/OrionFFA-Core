# OrionFFA-Core GUI configuration
#
# Each menu supports:
#   title: MiniMessage title text
#   rows: 1-6 inventory rows
#   filler.enabled: whether empty slots receive the configured filler
#   filler.material/name/lore: appearance of filler slots
#
# Slots are zero-based: 0 is the first slot and 8 is the ninth slot.
# Actions are handled by OrionFFA and should not be renamed unless the code supports them.

menus:
  lobby:
    items:
      kits:
        slot: 0
        material: DIAMOND_SWORD
        name: "<aqua>Kits"
        lore:
          - "<gray>Choose your FFA kit."
        action: open_kits
      editor:
        slot: 1
        material: ANVIL
        name: "<yellow>Edit Kits"
        lore:
          - "<gray>Customize your saved kit."
        action: open_kit_editor
      arenas:
        slot: 2
        material: COMPASS
        name: "<green>Arenas"
        lore:
          - "<gray>Browse every FFA arena."
          - "<gray>See players and availability."
        action: open_arenas
      spectator:
        slot: 4
        material: ENDER_EYE
        name: "<light_purple>Spectate"
        lore:
          - "<gray>Watch an active FFA player."
        action: open_spectator
      party:
        slot: 7
        material: PLAYER_HEAD
        name: "<light_purple>Party"
        lore:
          - "<gray>Manage your party."
        action: open_party
      stats:
        slot: 8
        material: BOOK
        name: "<gold>Statistics"
        lore:
          - "<gray>View your FFA statistics."
        action: open_stats

  # Player kit selection. If a personal preference exists, OrionFFA opens
  # kit_preference so the player can choose the admin kit or their own version.
  kit_selector:
    title: "<dark_gray>Select a Kit"
    rows: 6
    filler:
      enabled: true
      material: GRAY_STAINED_GLASS_PANE
      name: " "
      lore: []
    back:
      slot: 49
      material: ARROW
      name: "<yellow>Back"
      lore:
        - "<gray>Return to the FFA lobby."

  # Kit editor selector. Admins see the Create Admin Kit item below.
  kit_editor:
    title: "<dark_gray>Edit Kits"
    rows: 6
    filler:
      enabled: true
      material: BLACK_STAINED_GLASS_PANE
      name: " "
      lore: []
    admin-kits-start: 10
    create:
      slot: 4
      material: WRITABLE_BOOK
      name: "<green>Create Admin Kit"
      lore:
        - "<gray>Build a new public kit from your inventory."
        - "<gray>Click, arrange the kit, then enter its name in chat."
    back:
      slot: 49
      material: ARROW
      name: "<yellow>Back"
      lore:
        - "<gray>Return to the FFA lobby."

  # Shown after a player has a saved preference for an admin kit.
  kit_preference:
    title: "<dark_gray>Choose Kit Version"
    rows: 3
    filler:
      enabled: true
      material: GRAY_STAINED_GLASS_PANE
      name: " "
      lore: []
    default:
      slot: 11
      material: DIAMOND
      name: "<aqua>Admin Kit"
      lore:
        - "<gray>Use the current public/admin version."
    custom:
      slot: 15
      material: PLAYER_HEAD
      name: "<green>Your Preference"
      lore:
        - "<gray>Use your saved version of this kit."
    delete:
      slot: 22
      material: BARRIER
      name: "<red>Delete Preference"
      lore:
        - "<gray>Remove your saved version."
    back:
      slot: 26
      material: ARROW
      name: "<yellow>Back"
      lore:
        - "<gray>Return to kit selection."

  arena_selector:
    title: "<dark_gray>Select an Arena"
    rows: 6
    filler:
      enabled: true
      material: GRAY_STAINED_GLASS_PANE
      name: " "
      lore: []
    items:
      back:
        slot: 49
        material: ARROW
        name: "<yellow>Back"
        lore:
          - "<gray>Return to the kit selector or lobby."
        action: back

  spectator_selector:
    title: "<dark_gray>Select a Player"
    rows: 6
    items:
      back:
        slot: 53
        material: ARROW
        name: "<yellow>Back"
        lore:
          - "<gray>Return to the FFA lobby."
        action: back

  party:
    title: "<dark_gray>Party"
    rows: 3
    items:
      back:
        slot: 26
        material: ARROW
        name: "<yellow>Back"
        lore:
          - "<gray>Return to the FFA lobby."
        action: back

  party_invites:
    title: "<dark_gray>Invite a Player"
    rows: 6
    items:
      back:
        slot: 53
        material: ARROW
        name: "<yellow>Back"
        lore:
          - "<gray>Return to the party menu."
        action: back

  statistics:
    title: "<dark_gray>Statistics"
    rows: 3
    items:
      back:
        slot: 26
        material: ARROW
        name: "<yellow>Back"
        lore:
          - "<gray>Return to the FFA lobby."
        action: back
