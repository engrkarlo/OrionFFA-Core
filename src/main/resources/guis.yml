# OrionFFA-Core GUI configuration
#
# All GUI titles use MiniMessage formatting.
# Rows must be between 1 and 6.
# Inventory slots are zero-based: 0 is the first slot, 8 is the last slot of row one.
# Filler is placed only into empty slots, so kit/utility items can replace it.
#
# The kit editor is intentionally split from kits.yml:
# - guis.yml controls presentation, slots, filler and editor controls.
# - kits.yml stores the actual public/admin kit definitions.
# - Player preferences are stored by OrionFFA per player and per kit id.
#
# Item actions are internal identifiers. Do not rename an action unless the plugin code supports it.

menus:
  lobby:
    items:
      kits:
        slot: 0
        material: DIAMOND_SWORD
        name: "<aqua>Kits"
        lore:
          - "<gray>Choose your FFA kit."
        action: open_kits
      editor:
        slot: 1
        material: ANVIL
        name: "<yellow>Edit Kits"
        lore:
          - "<gray>Customize one of the available kits."
        action: open_kit_editor
      arenas:
        slot: 2
        material: COMPASS
        name: "<green>Arenas"
        lore:
          - "<gray>Browse every FFA arena."
          - "<gray>See players and availability."
        action: open_arenas
      spectator:
        slot: 4
        material: ENDER_EYE
        name: "<light_purple>Spectate"
        lore:
          - "<gray>Watch an active FFA player."
        action: open_spectator
      party:
        slot: 7
        material: PLAYER_HEAD
        name: "<light_purple>Party"
        lore:
          - "<gray>Manage your party."
        action: open_party
      stats:
        slot: 8
        material: BOOK
        name: "<gold>Statistics"
        lore:
          - "<gray>View your FFA statistics."
        action: open_stats

  kit_selector:
    title: "<dark_gray>Select a Kit"
    rows: 6
    filler:
      enabled: true
      material: GRAY_STAINED_GLASS_PANE
      name: " "
      lore: []
    back:
      slot: 49
      material: ARROW
      name: "<yellow>Back"
      lore:
        - "<gray>Return to the FFA lobby."

  kit_editor:
    title: "<dark_gray>Edit Kits"
    rows: 6
    filler:
      enabled: true
      material: BLACK_STAINED_GLASS_PANE
      name: " "
      lore: []
    admin-kits-start: 10
    create:
      slot: 4
      material: WRITABLE_BOOK
      name: "<green>Create Admin Kit"
      lore:
        - "<gray>Create a new public kit."
        - "<gray>Your inventory is used as the starting definition."
        - "<yellow>Click to begin."
    back:
      slot: 49
      material: ARROW
      name: "<yellow>Back"
      lore:
        - "<gray>Return to the FFA lobby."

  # Legacy compatibility section retained for GuiManager validation and older code paths.
  # The rewritten kit editor does NOT use this menu; KitGuiManager owns the new editor.
  kit_editor_selector:
    title: "<dark_gray>Edit Kits"
    rows: 6
    filler:
      enabled: true
      material: BLACK_STAINED_GLASS_PANE
      name: " "
      lore: []
    items:
      back:
        slot: 49
        material: ARROW
        name: "<yellow>Back"
        lore:
          - "<gray>Return to the FFA lobby."
        action: back

  kit_preference:
    title: "<dark_gray>Choose Kit Version"
    rows: 3
    filler:
      enabled: true
      material: GRAY_STAINED_GLASS_PANE
      name: " "
      lore: []
    default:
      slot: 11
      material: DIAMOND
      name: "<aqua>Admin Kit"
      lore:
        - "<gray>Use the current public/admin definition."
    custom:
      slot: 15
      material: PLAYER_HEAD
      name: "<green>Your Preference"
      lore:
        - "<gray>Use your saved version of this kit."
    delete:
      slot: 22
      material: BARRIER
      name: "<red>Delete Preference"
      lore:
        - "<gray>Remove your saved version."
    back:
      slot: 26
      material: ARROW
      name: "<yellow>Back"
      lore:
        - "<gray>Return to kit selection."

  kit_editing:
    controls:
      save:
        slot: 7
        material: LIME_DYE
        name: "<green>Save Preference"
        lore:
          - "<gray>Save this version for yourself."
          - "<yellow>Only you will be able to use it."
      delete:
        slot: 8
        material: BARRIER
        name: "<red>Delete Preference"
        lore:
          - "<gray>Delete your saved version of this kit."
          - "<dark_gray>The public admin kit is unchanged."
      save-admin:
        slot: 7
        material: NETHER_STAR
        name: "<gold>Save Admin Kit"
        lore:
          - "<gray>Update the public/admin definition."
          - "<yellow>This changes the kit for everyone."
      leave:
        slot: 6
        material: OAK_DOOR
        name: "<yellow>Leave Kit Editor"
        lore:
          - "<gray>Return to the FFA lobby."
          - "<gray>Your lobby hotbar will be restored."

  arena_selector:
    title: "<dark_gray>Select an Arena"
    rows: 6
    filler:
      enabled: true
      material: GRAY_STAINED_GLASS_PANE
      name: " "
      lore: []
    items:
      back:
        slot: 49
        material: ARROW
        name: "<yellow>Back"
        lore:
          - "<gray>Return to the kit selector or lobby."
        action: back

  spectator_selector:
    title: "<dark_gray>Select a Player"
    rows: 6
    filler:
      enabled: true
      material: GRAY_STAINED_GLASS_PANE
      name: " "
      lore:
        - ""
    items:
      back:
        slot: 53
        material: ARROW
        name: "<yellow>Back"
        lore:
          - "<gray>Return to the FFA lobby."
        action: back

  # Hotbar items while spectating. These items are tagged and protected from
  # their normal Minecraft behaviour (for example an ender pearl cannot be thrown).
  # open_spectator opens the same player selector again; exit_spectating returns to lobby.
  spectating:
    items:
      switch:
        slot: 0
        material: COMPASS
        name: "<light_purple>Switch Spectator"
        lore:
          - "<gray>Choose another player who is currently in an arena."
        action: open_spectator
      exit:
        slot: 8
        material: BARRIER
        name: "<red>Exit Spectating"
        lore:
          - "<gray>Return to the FFA lobby."
        action: exit_spectating

  party:
    title: "<dark_gray>Party"
    rows: 3
    items:
      back:
        slot: 26
        material: ARROW
        name: "<yellow>Back"
        lore:
          - "<gray>Return to the FFA lobby."
        action: back

  party_invites:
    title: "<dark_gray>Invite a Player"
    rows: 6
    items:
      back:
        slot: 53
        material: ARROW
        name: "<yellow>Back"
        lore:
          - "<gray>Return to the party menu."
        action: back

  statistics:
    title: "<dark_gray>Statistics"
    rows: 3
    items:
      back:
        slot: 26
        material: ARROW
        name: "<yellow>Back"
        lore:
          - "<gray>Return to the FFA lobby."
        action: back
