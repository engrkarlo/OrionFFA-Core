plugin:
  debug: false

general:
  default-gamemode: SURVIVAL

# Set this in-game with /offa setlobby.
# lobby:
#   world: world
#   x: 0.5
#   y: 100.0
#   z: 0.5
#   yaw: 0.0
#   pitch: 0.0

# Optional until configured with /offa seteditkit.
# edit-kit:
#   world: world
#   x: 0.5
#   y: 100.0
#   z: 0.5
#   yaw: 0.0
#   pitch: 0.0

ffa:
  enabled: true

combat:
  tag-seconds: 10
  killer-credit-seconds: 15

arena-selection:
  mode: automatic
  strategy: least-occupied
  cancel-item:
    material: BARRIER
    amount: 1
    slot: 8
    name: "<red>Cancel Arena Selection</red>"
    lore:
      - "<gray>Click to cancel arena creation."

arena-reset:
  enabled: true
  async: true
  schedule:
    enabled: false
    interval-seconds: 300

party:
  max-size: 10
  invite-seconds: 60

split:
  enabled: true
  minimum-size: 2

storage:
  type: yaml

# Public/admin kits are stored separately in plugins/OrionFFA-Core/kits.yml.
# The file intentionally starts empty; create kits through the built-in editor.
