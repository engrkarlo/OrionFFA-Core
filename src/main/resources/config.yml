plugin:
  debug: false

general:
  default-gamemode: SURVIVAL

lobby:
  world: world
  x: 0.5
  y: 100.0
  z: 0.5
  yaw: 0.0
  pitch: 0.0

edit-kit:
  world: world
  x: 0.5
  y: 100.0
  z: 0.5
  yaw: 0.0
  pitch: 0.0

ffa:
  enabled: true

combat:
  tag-seconds: 10
  killer-credit-seconds: 15

# Player-facing arena selection behavior. Arena definitions live in arenas.yml.
arena-selection:
  mode: automatic
  strategy: least-occupied

# Arena reset behavior. Individual arena schematic paths and reset regions live in arenas.yml.
arena-reset:
  enabled: true
  async: true
  schedule:
    enabled: false
    interval-seconds: 300

party:
  max-size: 10
  invite-seconds: 60

split:
  enabled: true
  minimum-size: 2

storage:
  type: yaml

kits:
  sword:
    enabled: true
    display-name: "<aqua>Sword</aqua>"
    icon: DIAMOND_SWORD
    inventory:
      - slot: 0
        material: DIAMOND_SWORD
        amount: 1
      - slot: 1
        material: GOLDEN_APPLE
        amount: 16
    armor:
      helmet: DIAMOND_HELMET
      chestplate: DIAMOND_CHESTPLATE
      leggings: DIAMOND_LEGGINGS
      boots: DIAMOND_BOOTS
  nethpot:
    enabled: true
    display-name: "<gold>NethPot</gold>"
    icon: NETHERITE_SWORD
    inventory:
      - slot: 0
        material: NETHERITE_SWORD
        amount: 1
      - slot: 1
        material: ENDER_PEARL
        amount: 16
      - slot: 2
        material: SPLASH_POTION
        amount: 32
    armor:
      helmet: NETHERITE_HELMET
      chestplate: NETHERITE_CHESTPLATE
      leggings: NETHERITE_LEGGINGS
      boots: NETHERITE_BOOTS
