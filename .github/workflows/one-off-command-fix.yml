name: One-off command cleanup

on:
  push:
    branches: [rewrite-completion]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, '[auto-fix-complete]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Remove /offa menu command
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/main/java/com/karlo/orionffa/command/OrionFFACommand.java')
          text = path.read_text()

          text = text.replace('            case "menu" -> menu(sender);\n', '')
          text = text.replace('''\n    private boolean menu(CommandSender sender) {\n        Player player = player(sender);\n        if (player != null) guis.openMain(player);\n        return true;\n    }\n''', '\n')
          text = text.replace('kit save|leave, menu, leave, spectate', 'kit save|leave, leave, spectate')
          text = text.replace('commands.addAll(List.of("menu", "join", "leave", "spectate", "party"));', 'commands.addAll(List.of("join", "leave", "spectate", "party"));')
          text = text.replace('commands.addAll(List.of("menu", "join", "back", "spectate", "party"));', 'commands.addAll(List.of("join", "spectate", "party"));')
          path.write_text(text)

      - name: Remove this temporary workflow and commit
        shell: bash
        run: |
          rm -f .github/workflows/one-off-command-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java/com/karlo/orionffa/command/OrionFFACommand.java .github/workflows/one-off-command-fix.yml
          git diff --cached --quiet && exit 0
          git commit -m "Remove /offa menu command [auto-fix-complete]"
          git push
